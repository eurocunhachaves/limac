<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="Inter, 'DejaVu Sans', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><filter id="sh" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#1f2328" flood-opacity="0.13"/></filter></defs><circle cx="90.0" cy="120.0" r="62" fill="#f6d9dd" stroke="#1f2328" stroke-width="2" opacity="1"/><circle cx="90.0" cy="120.0" r="40" fill="#fde8eb" stroke="#e3a6af" stroke-width="1.2" opacity="1"/><text x="90.0" y="238.8" font-size="12" font-weight="800" fill="#1f2328" text-anchor="middle"><tspan x="90.0" dy="0.0">Normal</tspan></text><text x="90.0" y="266.0" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle"><tspan x="90.0" dy="0.0"></tspan></text><circle cx="270.0" cy="120.0" r="58" fill="#f3c9cf" stroke="#2458b3" stroke-width="2" opacity="1"/><circle cx="270.0" cy="120.0" r="28" fill="#fde8eb" stroke="#e3a6af" stroke-width="1.2" opacity="1"/><text x="270.0" y="238.8" font-size="12" font-weight="800" fill="#2458b3" text-anchor="middle"><tspan x="270.0" dy="0.0">Eutrófica</tspan><tspan x="270.0" dy="15.0">concêntrica</tspan></text><text x="270.0" y="266.0" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle"><tspan x="270.0" dy="0.0">↑ pressão (pequenas</tspan><tspan x="270.0" dy="12.5">artérias e arteríolas)</tspan></text><circle cx="450.0" cy="120.0" r="74" fill="#f3c9cf" stroke="#b42336" stroke-width="2" opacity="1"/><circle cx="450.0" cy="120.0" r="40" fill="#fde8eb" stroke="#e3a6af" stroke-width="1.2" opacity="1"/><text x="450.0" y="238.8" font-size="12" font-weight="800" fill="#b42336" text-anchor="middle"><tspan x="450.0" dy="0.0">Hipertrófica</tspan></text><text x="450.0" y="266.0" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle"><tspan x="450.0" dy="0.0">↑ pressão (grandes</tspan><tspan x="450.0" dy="12.5">artérias): parede</tspan><tspan x="450.0" dy="12.5">mais grossa e rígida</tspan></text><circle cx="630.0" cy="120.0" r="76" fill="#f3c9cf" stroke="#23803d" stroke-width="2" opacity="1"/><circle cx="630.0" cy="120.0" r="54" fill="#fde8eb" stroke="#e3a6af" stroke-width="1.2" opacity="1"/><text x="630.0" y="238.8" font-size="12" font-weight="800" fill="#23803d" text-anchor="middle"><tspan x="630.0" dy="0.0">Eutrófica</tspan><tspan x="630.0" dy="15.0">excêntrica</tspan></text><text x="630.0" y="266.0" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle"><tspan x="630.0" dy="0.0">↑ fluxo (fístula AV,</tspan><tspan x="630.0" dy="12.5">artéria radial)</tspan></text><circle cx="810.0" cy="120.0" r="86" fill="#f3c9cf" stroke="#6d3fc4" stroke-width="2" opacity="1"/><circle cx="810.0" cy="120.0" r="54" fill="#fde8eb" stroke="#e3a6af" stroke-width="1.2" opacity="1"/><text x="810.0" y="238.8" font-size="12" font-weight="800" fill="#6d3fc4" text-anchor="middle"><tspan x="810.0" dy="0.0">Hipertrófica</tspan><tspan x="810.0" dy="15.0">excêntrica</tspan></text><text x="810.0" y="266.0" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle"><tspan x="810.0" dy="0.0">↑ pressão + ↑ fluxo</tspan><tspan x="810.0" dy="12.5">(veia da fístula,</tspan><tspan x="810.0" dy="12.5">ponte de safena)</tspan></text><text x="450.0" y="18.0" font-size="11" font-weight="600" fill="#1f2328" text-anchor="middle"><tspan x="450.0" dy="0.0">Laplace: T = P × r · mais pressão → mais parede; mais fluxo (cisalhamento) → mais luz</tspan></text></svg>